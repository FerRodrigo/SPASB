{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPASB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #e94560;
            color: white;
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.2);
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.5); }
        .btn-login {
            background: linear-gradient(135deg, #e94560, #c73e54);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
        }
        .btn-login:hover { background: linear-gradient(135deg, #c73e54, #a83246); }
        .error-message {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.3);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <i class="bi bi-wallet2" style="font-size: 3rem; color: #e94560;"></i>
        <h2 class="mt-3 mb-4">SPASB</h2>
        <p class="text-white-50 mb-4">Entrar no Sistema</p>

        {% if error %}
            <div class="error-message">
                <i class="bi bi-exclamation-triangle me-2"></i>
                Usuário ou senha incorretos. Tente novamente.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" class="form-control mb-3" placeholder="Usuário" required>
            <input type="password" name="password" class="form-control mb-4" placeholder="Senha" required>
            <button type="submit" class="btn btn-login text-white">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>

        <p class="text-white-50 mt-4 small">
            <i class="bi bi-shield-check me-2"></i>Acesso restrito
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
