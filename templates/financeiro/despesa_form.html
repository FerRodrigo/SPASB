{% extends 'base.html' %}
{% block title %}{{ acao }} Despesa{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="glass p-4">
            <h3 class="mb-4"><i class="bi bi-arrow-up-circle text-danger me-2"></i>{{ acao }} Despesa</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    {{ form.descricao }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    {{ form.tipo }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Valor (R$)</label>
                    {{ form.valor }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Data</label>
                    {{ form.data }}
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-glass" style="background: linear-gradient(135deg, #e94560, #c73e54);">
                        <i class="bi bi-check-lg me-2"></i>Salvar
                    </button>
                    <a href="/financeiro/despesa/" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
